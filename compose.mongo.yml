version: '3.8'
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (e) {
            if (e.code !== 94) throw e;
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
networks:
  default:
    name: lumenrise
    external: true
volumes:
  mongo-data:
    name: lumenrise-mongo-data
