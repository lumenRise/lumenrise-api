version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lumenrise
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (letters and digits)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 127.0.0.1:15672:15672
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
networks:
  default:
    name: lumenrise
    external: true
volumes:
  rabbitmq-data:
    name: lumenrise-rabbitmq-data
