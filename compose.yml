version: '3.8'
services:
  api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URI: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: ${DB_NAME:-lumenrise}
      RABBITMQ_URL: amqp://lumenrise:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
    ports:
      - 5000:5000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
networks:
  default:
    name: lumenrise
    external: true
