services:
  api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URI: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: ${DB_NAME:-lumenrise}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lumenrise}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      TESTNET_TOML: /app/storage/testnet/${STELLAR_TESTNET_TOML_FILENAME:-testnet_stellar.toml}
      PUBLIC_TOML: /app/storage/public/${STELLAR_PUBLIC_TOML_FILENAME:-stellar.toml}
    volumes:
      - '${STELLAR_TESTNET_TOML_DIRNAME:-/var/www/lumenrise/testnet}:/app/storage/testnet'
      - '${STELLAR_PUBLIC_TOML_DIRNAME:-/var/www/lumenrise/public}:/app/storage/public'
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - 127.0.0.1:3002:5000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    volumes:
      - mongo-data:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (e) {
            if (e.code !== 94) throw e;
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lumenrise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (letters and digits)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 127.0.0.1:5672:5672
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
networks:
  default:
    name: lumenrise
    external: true
volumes:
  mongo-data:
    name: lumenrise-mongo-data
  rabbitmq-data:
    name: lumenrise-rabbitmq-data
