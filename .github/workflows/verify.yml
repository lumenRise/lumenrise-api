name: Verify API and Reputation

on:
  push:
  pull_request:

jobs:
  integrated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - uses: actions/checkout@v4
        with:
          repository: poconik/lumenrise-reputation
          token: ${{ secrets.MODEL_PARITY_READ_TOKEN }}
          path: reputation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: reputation
      - run: ./scripts/test-with-services.sh
        working-directory: reputation
        env:
          LUMENRISE_API_PATH: ${{ github.workspace }}/api
